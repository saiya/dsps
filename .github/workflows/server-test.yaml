name: Server Test
on: push

permissions:
  contents: read

jobs:
  lint:
    name: Server lint

    runs-on: ubuntu-latest
    env:
      go-version: 1.15.6

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      # Note: golangci/golangci-lint-action caches. Should not use actions/cache@v2 otherwise result in so many "File exists"
      - uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: ${{ env.go-version }}
      - name: generate
        shell: bash
        working-directory: server
        run: |
          go mod download
          make generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@5c56cd6c9dc07901af25baab6f2b0d9f3b7c3018 # v2
        with:
          version: v1.33.0
          working-directory: server
      - name: Other Lint
        shell: bash
        working-directory: server
        run: |
          make lint
      - name: Update Go Report Card
        if: github.ref == 'refs/heads/main'
        shell: bash
        working-directory: server
        run: curl -X POST -F "repo=github.com/$GITHUB_REPOSITORY" https://goreportcard.com/checks

  test:
    name: Server test

    runs-on: ubuntu-latest
    container: golang:1.15.6-buster
    services:
      redis:
        image: redis:6.0.9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: /go/pkg/mod  # Not ~/go/pkg/mod because "container" is active.
          key: ${{ runner.os }}-server-gomod-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-server-gomod-
      - uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        shell: bash
        working-directory: server
        run: |
          make test
        env:
          DSPS_REDIS: "redis:6379"
      - uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2
        with:
          name: coverage.html
          path: server/coverage.html

  build-test:
    name: Server Build

    runs-on: ubuntu-latest
    env:
      go-version: 1.15.6

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      # Note: golangci/golangci-lint-action caches. Should not use actions/cache@v2 otherwise result in so many "File exists"
      - uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: ${{ env.go-version }}
      - name: build
        shell: bash
        working-directory: server
        run: |
          go mod download
          make build
