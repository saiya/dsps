name: Client (JS) Test
on: push

permissions:
  contents: read

jobs:
  lint:
    name: JS client lint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: client/js/node_modules
          key: ${{ runner.os }}-clinet-js-modules-${{ hashFiles('client/js/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-clinet-js-modules-
      - name: Install modules
        run: yarn
        working-directory: client/js
      - name: Lint
        run: yarn lint
        working-directory: client/js

  test:
    name: JS client test

    runs-on: ubuntu-latest
    env:
      go-version: 1.15.6

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: ${{ env.go-version }}

      - uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: client/js/node_modules
          key: ${{ runner.os }}-clinet-js-modules-${{ hashFiles('client/js/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-clinet-js-modules-
      - name: Install modules
        run: yarn
        working-directory: client/js
      - name: Run tests
        run: |
          pushd server
          go build -o dsps.bin main.go
          ./dsps.bin &
          sleep 1
          curl http://localhost:3000/probe/liveness
          popd

          pushd client/js
          DSPS_BASE_URL="http://localhost:3000/" yarn test:ci
      - uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2
        with:
          name: coverage
          path: client/js/coverage
